[project]
name = "ratplan-itwom-client"
version = "0.1.0"
description = "RATPLAN's client for the ITWOM/SPLAT! service (../itwom) — calls it via docker run, stays out of GPL-2.0 scope"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ratplan_itwom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires Docker and the ratplan-itwom-service image (see ../itwom/Dockerfile)",
]
