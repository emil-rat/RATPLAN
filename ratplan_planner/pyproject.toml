[project]
name = "ratplan-planner"
version = "0.1.0"
description = "RATPLAN's mission planner — the DP over road positions (model.md §5) that consumes Scan/Evaluate/BatteryModel/Samband and produces ranked mission candidates"
requires-python = ">=3.11"
dependencies = [
    "ratplan-terrain",
    "ratplan-itm",
    # ratplan_terrain.primitives.terrain_profile unconditionally imports ratplan_itwom too, even though
    # scan.py only ever calls the ITM half of it - needed transitively for the import to succeed.
    "ratplan-itwom-client",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ratplan_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
