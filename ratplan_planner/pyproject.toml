[project]
name = "ratplan-planner"
version = "0.1.0"
description = "RATPLAN's mission planner — the DP over road positions (model.md §5) that consumes Scan/Evaluate/BatteryModel/Samband and produces ranked mission candidates"
requires-python = ">=3.11"
dependencies = [
    "ratplan-terrain",
    "ratplan-connectivity",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ratplan_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
