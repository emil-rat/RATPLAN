[project]
name = "ratplan-itm"
version = "0.1.0"
description = "RATPLAN's ITM (Longley-Rice) point-to-point path-loss module — thin wrapper around itmlogic"
requires-python = ">=3.11"
dependencies = [
    "itmlogic>=1.2",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ratplan_itm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
